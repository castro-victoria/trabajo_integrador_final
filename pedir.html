<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Che Bakery | Realizar pedido</title>
        <link rel="stylesheet" href="style.pedir.css">
        <script type="text/javascript" src="pedir.js" defer></script>
    </head>
    <body>
        <header>
            <div class="logo">
                <a href="index.html">
                    <img src="imagenes/index/Logo.png" alt="logo empresa">
                </a>
            </div>
            <nav>
                <a href="index.html">Inicio
                    <img src="fonts_icons/home.png" alt="inicio">
                </a>
                <a href="merch.html">Sabores
                    <img src="fonts_icons/sabores.png" alt="sabores">
                </a>
                <a href="pedir.html" class="activo">Pedir
                    <img src="fonts_icons/pedir.png" alt="pedir">
                </a>
            </nav>
        </header>
        <main>
            <h1>Realizá tu Pedido</h1>
            <form id="formPedido" novalidate>
                <fieldset>
                    <legend>Datos Personales</legend>
                    <div class="campo">
                        <label for="nombre">Nombre (*)</label>
                        <input type="text" id="nombre" name="nombre" minlength="2" maxlength="20" placeholder="Ingresá tu Nombre">
                    <div class="campo">
                        <label for="apellido">Apellido (*)</label>
                        <input type="text" id="apellido" name="apellido" minlength="2" maxlength="20" placeholder="Ingresá tu Apellido">
                    </div>
                    <div class="campo">
                        <label for="apellido">Correo Electrónico (*)</label>
                        <input type="email" id="email" name="email" maxlength="60" placeholder="ejemplo@mail.com">
                    </div>
                    <div class="campo">
                        <label for="telefono">Número de Teléfono (WhatsApp) (*)</label>
                        <input type="tel" id="telefono" name="telefono" maxlength="20" placeholder="Ej: 2657-303030">
                    </div>
                </fieldset>
                <fieldset>
                    <legend>Elegí tus Sabores</legend>
                    <p>Seleccioná los sabores y las cantidades que quieras pedir.</p>
                    <div id="contenedorSabores">
                        <div class="fila-sabor">
                            <div class="campo">
                                <label>Sabor</label>
                                <select name="sabor" class="select-sabor">
                                    <option value="">Seleccioná un sabor</option>
                                    <option value="Sableé Flan">Sableé Flan</option>
                                    <option value="Cookie Marroc">Cookie Marroc</option>
                                    <option value="Cookie Franui">Cookie Franui</option>
                                    <option value="Cookie Chocolatosa">Cookie Chocolatosa</option>
                                    <option value="Cookie Chips">Cookie Chips</option>
                                    <option value="Cookie de Vainilla y Americana">Cookie de Vainilla y Americana</option>
                                    <option value="Cookie Miel">Cookie Miel</option>
                                    <option value="Cookie Lemon">Cookie Lemon</option>
                                    <option value="Cookie Crumbl Manzana">Cookie Crumbl Manzana</option>
                                    <option value="Cookie Pistacho">Cookie Pistacho</option>
                                    <option value="Cookie Oreo">Cookie Oreo</option>
                                    <option value="Cookie Red Velvet">Cookie Red Velvet</option>
                                </select>
                            </div>
                            <div class="campo">
                                <label>Cantidad</label>
                                <input type="number" name="cantidad" class="cantidad-sabor" min="1" max="50" placeholder="Cantidad">
                            </div>
                            <button type="button" class="btnEliminarSabor">Eliminar</button>
                        </div>
                    </div>
                    <button type="button" id="btnAgregarSabor">+ Agregar otro sabor</button>
                </fieldset>
                <button type="submit" id="btnEnviar">Enviar pedido</button>
            </form>
            <section id="respuesta" aria-live="polite"></section>
        </main>
        <footer class="footer">
                <div class="footer-logo">
                    <img src="imagenes/index/Logo.png" alt="Logo de Che Bakery">
                </div>
                <div class="footer-contacto">
                    <p>¡Seguinos y mantenete en contacto!</p>
                    <div class="redes">
                        <a href="https://www.facebook.com/" target="_blank">Facebook</a>
                        <a href="https://www.instagram.com/" target="_blank">Instagram</a>
                        <a href="mailto:contacto@chebakery.com.ar">Email</a>
                    </div>
                    <p class="copyright">
                        © 2026 Che Bakery - Todos los derechos reservados
                    </p>
                </div>
        </footer>
    </body>
</html>
